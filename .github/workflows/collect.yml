name: Collect harbor data

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can be delayed
    # or skipped under load, so treat generated_at in the JSON as the truth
    # rather than assuming freshness.
    - cron: '*/10 * * * *'
  workflow_dispatch:        # manual run button
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/collect.yml']

# Least privilege: the job needs to push data/latest.json and nothing else.
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parser tests
        run: node test/parser.test.mjs

      - name: Collect
        run: node scripts/collect.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/latest.json)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name  "harbor-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "data: $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another run may have landed while we were fetching.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "retry $i"; sleep 5
          done
          exit 1
